<!DOCTYPE html>
<html>
<head>
    <title>Hồ cá vui nhộn</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="mystyle.css">
</head>

<body>

<div class="wrapper">
    <div id="content">

        <div class="fish" id="shark"><img src="images/shark.png"></div>
        <div class="fish" id="diver1"><img src="images/diver1.png"></div>
        <div class="fish" id="diver2"><img src="images/diver2.png"></div>
        <div class="fish" id="diver3"><img src="images/diver3.png"></div>
        <div class="fish" id="turtle"><img src="images/turtle.png"></div>
        <div class="fish" id="goldfish"><img src="images/goldFishSchool.png"></div>
        <div class="fish" id="faintfish"><img src="images/faintSchool.png"></div>

        <div id="controls">
            <button id="musicBtn">🔊 Tắt nhạc</button>
            <button id="bgBtn">🖼 Đổi nền</button>
        </div>

    </div>
</div>

<audio id="myAudio" autoplay loop>
    <source src="babyshark.mp3" type="audio/mpeg">
</audio>

<script>
    const audio = document.getElementById("myAudio");
    const btn = document.getElementById("musicBtn");

    btn.addEventListener("click", () => {
        if (audio.paused) {
            audio.play();
            btn.textContent = "🔊 Tắt nhạc";
        } else {
            audio.pause();
            btn.textContent = "🔈 Bật nhạc";
        }
    });

    const backgrounds = [
        "images/bg1.jpg",
        "images/bg2.jpg",
        "images/bg3.jpg",
        "images/bg4.jpg"
    ];

    let bgIndex = 0;
    const bgBtn = document.getElementById("bgBtn");
    const content = document.getElementById("content");

    bgBtn.onclick = function() {
        bgIndex = (bgIndex + 1) % backgrounds.length;
        content.style.backgroundImage = `url('${backgrounds[bgIndex]}')`;
    };
</script>

</body>
</html>
