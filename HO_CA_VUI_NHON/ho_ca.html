<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hồ cá vui nhộn</title>
    <link rel="stylesheet" href="mystyle.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #content {
            width: 100vw;
            height: 100vh;
            background-image: url('images/bg1.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
        }

        .fish img {
            pointer-events: none;
            display: block;
        }

        #controls {
            position: absolute;
            bottom: 15px;
            right: 15px;
            z-index: 999;
            display: flex;
            gap: 10px;
        }

        #controls button {
            padding: 8px 14px;
            font-size: 15px;
            cursor: pointer;
            border-radius: 6px;
            border: 2px solid black;
        }
    </style>
</head>

<body>

<div id="content">

    <div class="fish" id="shark"><img src="images/shark.png" alt=""></div>
    <div class="fish" id="diver1"><img src="images/diver1.png" alt=""></div>
    <div class="fish" id="diver2"><img src="images/diver2.png" alt=""></div>
    <div class="fish" id="diver3"><img src="images/diver3.png" alt=""></div>
    <div class="fish" id="turtle"><img src="images/turtle.png" alt=""></div>
    <div class="fish" id="goldfish"><img src="images/goldFishSchool.png" alt=""></div>
    <div class="fish" id="faintfish"><img src="images/faintSchool.png" alt=""></div>

</div>

<audio id="myAudio" autoplay loop>
    <source src="babyshark.mp3" type="audio/mpeg">
</audio>

<div id="controls">
    <button id="musicBtn">🔊 Tắt nhạc</button>
    <button id="bgBtn">🖼 Đổi nền</button>
</div>

<script>
    const audio = document.getElementById("myAudio");
    const btn = document.getElementById("musicBtn");

    btn.addEventListener("click", () => {
        if (audio.paused) {
            audio.play();
            btn.textContent = "🔊 Tắt nhạc";
        } else {
            audio.pause();
            btn.textContent = "🔈 Bật nhạc";
        }
    });

    const backgrounds = [
        "images/bg1.jpg",
        "images/bg2.jpg",
        "images/bg3.jpg",
        "images/bg4.jpg"
    ];

    let bgIndex = 0;
    const bgBtn = document.getElementById("bgBtn");
    const content = document.getElementById("content");

    bgBtn.onclick = function() {
        bgIndex = (bgIndex + 1) % backgrounds.length;
        content.style.backgroundImage = `url('${backgrounds[bgIndex]}')`;
    };
</script>

</body>
</html>
